<h2>Create Order</h2>

<form method="POST">
    {% csrf_token %}
    <label>Product:</label>
    <select name="product">
        {% for product in products %}
            <option value="{{ product.id }}">
                {{ product.name }} ({{ product.available_quantity }} available)
            </option>
        {% endfor %}
    </select>

    <label>Quantity:</label>
    <input type="number" name="quantity">

    <button type="submit">Order</button>
</form>
